[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhuman-excel"
version = "0.1.0"
description = "Visible, human-paced desktop AI agent for Microsoft Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pywin32>=306; platform_system == 'Windows'",
  "openpyxl>=3.1.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
openh-excel = "openhuman_excel.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhuman_excel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
